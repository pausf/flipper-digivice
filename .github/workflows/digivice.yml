name: digivice

on:
  push:
    branches: [main, "digivice-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  rules-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run host rules test
        run: applications/services/digivice/test/run.sh

  firmware:
    needs: rules-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1
      - name: Build update package
        run: ./fbt COMPACT=1 DEBUG=0 updater_package
      - name: Report firmware size
        # fbt downloads its toolchain into toolchain/<arch>-<os>; text + data is the flash used.
        run: toolchain/x86_64-linux/bin/arm-none-eabi-size build/f7-firmware-C/firmware.elf
      - uses: actions/upload-artifact@v4
        with:
          name: digivice-update-package
          path: |
            dist/f7-C/f7-update-*/
            dist/f7-C/*.tgz
          if-no-files-found: error
